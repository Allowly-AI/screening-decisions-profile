name: Profile vectors

on:
  pull_request:
  push:

jobs:
  validate-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verifier and Ruff
        run: python3 -m pip install -r requirements.txt ruff==0.16.5
      - name: Lint Python
        run: python3 -m ruff check --select E4,E7,E9,F validators vectors
      - name: Validate profile vectors
        run: python3 validators/check_profile.py vectors/vectors.json --vectors
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cross-check the JavaScript validator against the Python one
        run: node validators/parity.test.mjs
